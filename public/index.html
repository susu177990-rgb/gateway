<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gateway · 模型网关</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/styles.css?v=33" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-start">
        <div class="logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 7h6v10H4V7zm10 0h6v6h-6V7zm0 8h6v2h-6v-2z" fill="currentColor" opacity="0.9"/>
          </svg>
        </div>
        <div>
          <p class="topbar-eyebrow">Model Gateway</p>
          <h1 class="topbar-title">Gateway</h1>
        </div>
      </div>
      <p id="status" class="status-pill">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">正在读取本地服务状态…</span>
      </p>
    </header>

    <main class="main">
      <section class="block" aria-labelledby="block-connect-title">
        <header class="block-header">
          <h2 id="block-connect-title" class="block-title">连接配置</h2>
          <p class="block-desc">在各自 AI 工具中选择协议并填入统一密钥；Gateway 同时开放两种入口。</p>
        </header>

        <div class="block-body connect-panel">
          <div class="connect-entries">
            <p class="field-label">连接入口</p>
            <ul class="entry-table" id="entryList">
              <li class="entry-table-row">
                <span class="protocol protocol-anthropic">Anthropic</span>
                <code class="entry-url mono" data-entry="anthropic"></code>
                <button type="button" class="btn btn-ghost btn-xs" data-copy="anthropic">复制</button>
              </li>
              <li class="entry-table-row">
                <span class="protocol protocol-openai">OpenAI</span>
                <code class="entry-url mono" data-entry="openai"></code>
                <button type="button" class="btn btn-ghost btn-xs" data-copy="openai">复制</button>
              </li>
            </ul>
          </div>

          <div class="connect-settings">
            <div class="connect-key">
              <p class="field-label">统一 API Key</p>
              <div class="gateway-key-row">
                <code id="gatewayClientKey" class="mono gateway-key-text"></code>
                <button type="button" class="btn btn-ghost btn-xs" data-copy-key>复制</button>
              </div>
            </div>

            <div class="connect-default">
              <label class="field-label" for="gatewayDefaultModel">Gateway 默认模型</label>
              <select id="gatewayDefaultModel" class="input input-fluid input-select">
                <option value="">选择默认模型</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <section class="block block-channels" aria-labelledby="block-channels-title">
        <header class="block-header block-header-row">
          <div>
            <h2 id="block-channels-title" class="block-title">模型渠道</h2>
            <p class="block-desc">默认只读展示；点「编辑」修改渠道，点「保存」写入并退出编辑。</p>
          </div>
          <button id="addBtn" type="button" class="btn btn-primary">添加渠道</button>
        </header>

        <div id="routes" class="channel-grid"></div>
      </section>
    </main>

    <footer class="page-footer">
      <span>当前地址 <code id="gatewayListenAddr" class="mono"></code></span>
    </footer>
  </div>

  <template id="routeTemplate">
    <article class="card">
      <header class="card-toolbar">
        <label class="switch" title="启用渠道">
          <input data-field="enabled" type="checkbox" />
          <span class="switch-track" aria-hidden="true"></span>
        </label>
        <span class="card-name-view card-view-only" data-role="nameView"></span>
        <input data-field="name" class="input input-title card-edit-only" placeholder="渠道名称" aria-label="渠道名称" />
        <div class="card-toolbar-actions">
          <button data-action="edit" type="button" class="btn btn-sm btn-outline card-view-only">编辑</button>
          <button data-action="save" type="button" class="btn btn-sm btn-primary card-edit-only">保存</button>
          <button data-action="delete" type="button" class="btn btn-sm btn-ghost card-edit-only" title="删除渠道">删除</button>
        </div>
      </header>

      <div class="card-view card-view-only" data-role="viewBody">
        <div class="view-fields">
          <div class="field">
            <p class="field-label">请求 URL</p>
            <p class="view-value mono" data-view="baseUrl"></p>
          </div>
          <div class="field">
            <p class="field-label">API Key</p>
            <p class="view-value mono" data-view="apiKey"></p>
          </div>
        </div>
        <div class="view-models-wrap">
          <p class="field-label">模型列表</p>
          <ul class="view-models" data-role="viewModels"></ul>
        </div>
      </div>

      <div class="card-edit card-edit-only" data-role="editBody">
        <div class="card-fields">
          <div class="field">
            <label class="field-label">请求 URL</label>
            <input data-field="baseUrl" class="input" placeholder="https://…/v1/chat/completions" aria-label="完整请求 URL" />
          </div>
          <div class="field">
            <label class="field-label">API Key</label>
            <input data-field="apiKey" class="input" type="text" placeholder="上游密钥" autocomplete="off" aria-label="API Key" />
          </div>
        </div>

        <div class="card-models">
          <div class="card-models-head">
            <span class="field-label">模型列表</span>
            <button data-action="add-model" type="button" class="btn btn-ghost btn-xs">+ 添加</button>
          </div>
          <div data-role="models" class="models-grid"></div>
        </div>
      </div>

    </article>
  </template>

  <template id="modelTemplate">
    <div class="model-cell">
      <input data-role="model-name" class="input input-mono" placeholder="模型 ID" aria-label="模型 ID" />
      <span class="model-test-state" data-role="modelTestState" aria-live="polite"></span>
      <button data-action="test-model" type="button" class="btn btn-outline btn-xs card-edit-only">测试</button>
      <button data-action="remove-model" type="button" class="btn btn-ghost btn-xs btn-square" title="删除" aria-label="删除模型">×</button>
    </div>
  </template>

  <script src="/app.js?v=25"></script>
</body>
</html>
